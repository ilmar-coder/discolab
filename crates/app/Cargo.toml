[package]
name = "discolab"
version = "0.1.1"
edition = "2024"
description = "Teste de saúde, benchmark e superfície para HDD, SSD, NVMe, eMMC e UFS"

[lib]
# Nome diferente do binário evita colisão de .pdb no Windows.
name = "discolab_app"
# "cdylib" é o formato exigido pelo Android (libdiscolab_app.so dentro do APK).
crate-type = ["lib", "cdylib"]

[[bin]]
name = "discolab"
path = "src/main.rs"

[dependencies]
discolab-core = { version = "0.1.1", path = "../core" }
egui_plot = "0.38.0"
serde_json = "1.0.154"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37.0"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity", "wgpu", "default_fonts"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }

[build-dependencies]
winresource = "0.1.34"

# ---- Empacotamento Android (cargo-apk) ----
[package.metadata.android]
package = "com.discolab.app"
apk_name = "DiscoLab"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "DiscoLab"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode"
orientation = "unspecified"

[[package.metadata.android.uses_feature]]
opengles_version = [3, 0]
required = true

[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = false

# ---- Pacote RPM (cargo generate-rpm -p crates/app) ----
[package.metadata.generate-rpm]
name = "discolab"
summary = "Teste de saúde (SMART), benchmark e superfície para HDD, SSD e NVMe"
license = "Proprietary"
url = "https://github.com/ilmar-coder/discolab"
assets = [
  { source = "target/release/discolab", dest = "/usr/bin/discolab", mode = "755" },
  { source = "target/release/discolab-cli", dest = "/usr/bin/discolab-cli", mode = "755" },
  { source = "packaging/linux/discolab-admin", dest = "/usr/bin/discolab-admin", mode = "755" },
  { source = "packaging/linux/discolab.desktop", dest = "/usr/share/applications/discolab.desktop", mode = "644" },
  { source = "packaging/linux/discolab.svg", dest = "/usr/share/icons/hicolor/scalable/apps/discolab.svg", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/discolab/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
smartmontools = "*"
polkit = "*"
