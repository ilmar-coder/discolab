name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências
        # X11/Wayland são carregados dinamicamente na execução; os cabeçalhos são opcionais.
        # Tolerante a espelhos do Ubuntu fora do ar.
        run: |
          sudo apt-get -o Acquire::Retries=5 update || true
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            || echo "::warning::Pacotes de desenvolvimento não instalados; seguindo sem eles"
      - run: cargo test -p discolab-core
      - run: cargo build --release -p discolab -p discolab-cli
      - name: Pacote RPM
        run: |
          cargo install cargo-generate-rpm --locked
          strip target/release/discolab target/release/discolab-cli
          cargo generate-rpm -p crates/app
          mkdir -p dist && cp target/generate-rpm/*.rpm dist/
          ls -la dist
      - name: Tarball
        run: |
          mkdir -p pkg/discolab && cp target/release/discolab target/release/discolab-cli packaging/linux/* README.md pkg/discolab/
          tar -C pkg -czf dist/discolab-linux-x86_64.tar.gz discolab
      - uses: actions/upload-artifact@v4
        with:
          name: discolab-linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Baixar e verificar o smartctl oficial (smartmontools 7.5)
        shell: pwsh
        run: |
          $base = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5"
          $exe = "smartmontools-7.5.win32-setup.exe"
          New-Item -ItemType Directory -Force -Path sm | Out-Null
          Invoke-WebRequest "$base/$exe" -OutFile "sm/$exe"
          Invoke-WebRequest "$base/$exe.md5" -OutFile "sm/$exe.md5"
          $expected = ((Get-Content "sm/$exe.md5" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash "sm/$exe" -Algorithm MD5).Hash.ToLower()
          if ($expected -ne $actual) { throw "MD5 não confere: $actual != $expected" }
          "SHA256: " + (Get-FileHash "sm/$exe" -Algorithm SHA256).Hash
          7z x "sm/$exe" -osm/x -y | Out-Null
          # Escolhe o smartctl.exe de 64 bits (máquina PE 0x8664).
          $pick = $null
          foreach ($f in Get-ChildItem sm/x -Recurse -Filter smartctl.exe) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([BitConverter]::ToUInt16($b, $pe + 4) -eq 0x8664) { $pick = $f.FullName }
          }
          if (-not $pick) { throw "smartctl.exe de 64 bits não encontrado" }
          Copy-Item $pick sm/smartctl.exe
          & sm/smartctl.exe --version | Select-Object -First 1
          $lic = Get-ChildItem sm/x -Recurse -Include COPYING*, LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName sm/smartmontools-LICENSE.txt }
          "DISCOLAB_SMARTCTL=$((Resolve-Path sm/smartctl.exe).Path)" >> $env:GITHUB_ENV
      - run: cargo test -p discolab-core
      - run: cargo build --release -p discolab -p discolab-cli
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/DiscoLab, dist | Out-Null
          Copy-Item target/release/discolab.exe, target/release/discolab-cli.exe, README.md pkg/DiscoLab/
          if (Test-Path sm/smartmontools-LICENSE.txt) { Copy-Item sm/smartmontools-LICENSE.txt pkg/DiscoLab/ }
          Set-Content pkg/DiscoLab/SMARTMONTOOLS.txt "Este DiscoLab traz embutido o smartctl 7.5 (smartmontools, GPL-2.0), sem modificações.`r`nCódigo-fonte: https://github.com/smartmontools/smartmontools/releases/tag/RELEASE_7_5"
          # Executável único, para levar em pendrive
          Copy-Item target/release/discolab.exe dist/DiscoLab-portable.exe
          Compress-Archive -Path pkg/DiscoLab -DestinationPath dist/DiscoLab-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: discolab-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p discolab-core
      - name: App
        run: |
          brew install smartmontools
          ./scripts/package-macos.sh
          mkdir -p dist && ditto -c -k --keepParent target/DiscoLab.app dist/DiscoLab-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: discolab-macos
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-apk --locked
      - name: Gerar APK
        run: |
          # Mesmo NDK usado no build local.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          # Chave temporária só para o CI (a chave de publicação fica fora do repositório).
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -alias discolab -keyalg RSA -keysize 2048 \
            -validity 365 -storepass "$PASS" -keypass "$PASS" -dname "CN=DiscoLab CI"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/ci.keystore" CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$PASS"
          cargo apk build -p discolab --lib --release
          mkdir -p dist && cp target/release/apk/DiscoLab.apk dist/DiscoLab-android-ci.apk
      - uses: actions/upload-artifact@v4
        with:
          name: discolab-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Downloads**
            - **Windows:** `DiscoLab-portable.exe` — um único arquivo, sem instalar nada: já traz o smartctl embutido e pede administrador ao abrir. O `DiscoLab-windows-x64.zip` tem o mesmo programa mais a CLI.
            - **Linux (Fedora/openSUSE/RHEL):** `sudo dnf install ./discolab-*.x86_64.rpm` — no menu aparece "DiscoLab" e a ação "Abrir como administrador".
            - **Linux (outras):** `discolab-linux-x86_64.tar.gz`.
            - **macOS (Apple Silicon):** `DiscoLab-macos-arm64.zip` (com smartctl embutido).
            - **Android:** `DiscoLab-android-ci.apk` (assinado com chave de CI; para atualizar por cima, use sempre a mesma origem do APK).
